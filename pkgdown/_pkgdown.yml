url: https://github.com/harmonize-tools/land4health
description: Extract remote sensing metrics for spatial health analysis 🛰. Quick and easy areal and zonal statistics for infectious disease modeling in spatial epidemiology 🦠🏥.
home:
  title: land4health

authors:
  Antony Barja:
    href: https://geografo.pe

repo:
  url:
    home: https://github.com/harmonize-tools/land4health
    source: https://github.com/harmonize-tools/land4health/tree/main
    issues: https://github.com/harmonize-tools/land4health/issues

template:
  bootstrap: 5
  light-switch: true

development:
  mode: auto

navbar:
  bg: custom
  structure:
    left: [reference, tutorials, resources, news]
    right: [search, github, donate, lightswitch]

  components:
    donate:
      icon: fa-hand-holding-dollar
      href: https://ko-fi.com/ambarja
      aria-label: Buy me a coffee

    tutorials:
      text: Examples
      menu:
        - text: 1. Environmental indicators – Brazil
          href: https://healthinnovation.github.io/l4h_brazil_case/cases1_brazil.html
          target: _blank
        - text: 2. Dengue – Colombia
          href: https://healthinnovation.github.io/l4h_colombia_case/case2_colombia.html
          target: _blank
        - text: 3. Malaria – Peruvian Amazon
          href: https://healthinnovation.github.io/l4h_peru_case/case3_peru.html
          target: _blank

    resources:
      text: Resources
      menu:
        - text: 1. rgee installation
          href: https://healthinnovation.github.io/epi-rgee/
          target: _blank
        - text: 2. rgee for applications in epidemiology
          href: https://epi-rgee.netlify.app/
          target: _blank

reference:
  - title: 'Vector-borne disease'
    contents:
      - l4h_dengue
      - l4h_malaria

  - title: 'Human intervention'
    contents:
      - l4h_forest_loss
      - l4h_night_lights
      - l4h_urban_rural_area
      - l4h_human_built

  - title: 'Accessibility'
    contents:
      - l4h_rural_access_index
      - l4h_travel_time

  - title: 'Environment'
    contents:
      - l4h_pm2_5
      - l4h_co_column
      - l4h_urban_heat_index
      - l4h_vegetation

  - title: 'Climate'
    contents:
      - l4h_terra_climate
      - l4h_sebal_modis
      - l4h_surface_temp
      - l4h_chirps

  - title: 'Utils'
    contents:
