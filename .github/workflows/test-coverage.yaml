# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::rgee, any::reticulate
          needs: coverage

      - name: Install Python and earthengine-api
        run: |
          pip install earthengine-api numpy
          mkdir -p ~/.config/earthengine
          python3 -c "import os; f=open(os.path.expanduser('~/.config/earthengine/credentials'),'w'); f.write(os.environ['EARTHENGINETOKEN']); f.close()"
        shell: bash
        env:
          EARTHENGINETOKEN: ${{ secrets.EARTHENGINETOKEN }}

      - name: Setup reticulate venv and install earthengine-api
        run: |
          py <- reticulate::py_config()$python
          message("Using Python: ", py)
          
          # Find uv binary that reticulate downloaded
          uv_bins <- list.files(
            file.path(path.expand("~"), ".cache", "R", "reticulate", "uv"),
            pattern = "^uv$", full.names = TRUE, recursive = TRUE
          )
          uv <- uv_bins[file.info(uv_bins)$isdir == FALSE]
          if (length(uv) == 0) uv <- uv_bins[1]
          message("uv binary: ", uv)
          
          # Install earthengine-api into reticulate's venv using uv (no pip needed)
          system2(uv, c("pip", "install", "--python", py, "earthengine-api", "numpy"))
          message("earthengine-api installed in reticulate venv")
          
          # Verify ee module is importable
          result <- tryCatch({
            reticulate::py_run_string("import ee")
            TRUE
          }, error = function(e) FALSE)
          message("ee module importable: ", result)

          tryCatch({
            library(rgee)
            ee_Initialize(
              email = Sys.getenv("GEE_EMAIL", "antony.barja8@gmail.com"),
              credentials = "persistent",
              auth_mode = "appdefault",
              drive = FALSE, gcs = FALSE, quiet = TRUE
            )
            message("Earth Engine initialized successfully")
          }, error = function(e) {
            message("GEE init failed (non-fatal): ", conditionMessage(e))
          })
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- tryCatch(
            covr::package_coverage(
              quiet = FALSE,
              clean = FALSE,
              install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
            ),
            error = function(e) {
              message("covr failed: ", conditionMessage(e))
              NULL
            }
          )
          if (!is.null(cov)) {
            print(cov)
            covr::to_cobertura(cov)
          } else {
            message("Skipping coverage upload due to test failures")
          }
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          echo "=== Searching for test output ==="
          for f in $(find /home/runner -name 'testthat.Rout.fail' 2>/dev/null | head -5); do
            echo "=== $f ==="
            cat "$f"
          done
          for f in $(find /home/runner -name 'testthat.Rout' 2>/dev/null | head -5); do
            echo "=== $f ==="
            cat "$f"
          done
        shell: bash

      - name: Upload coverage to Codecov
        if: hashFiles('cobertura.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
