# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EARTHENGINETOKEN: ${{ secrets.EARTHENGINETOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::rgee, any::reticulate
          needs: coverage

      - name: Install Python and earthengine-api
        run: |
          pip install earthengine-api numpy
          mkdir -p ~/.config/earthengine
          echo '${{ secrets.EARTHENGINETOKEN }}' | base64 -d > ~/.config/earthengine/credentials
        shell: bash

      - name: Initialize Earth Engine
        run: |
          tryCatch({
            library(rgee)
            ee_Initialize(
              email = Sys.getenv("GEE_EMAIL", "antony.barja8@gmail.com"),
              credentials = "persistent",
              auth_mode = "appdefault",
              drive = FALSE, gcs = FALSE, quiet = TRUE
            )
            message("Earth Engine initialized successfully")
          }, error = function(e) {
            message("GEE init failed (non-fatal): ", conditionMessage(e))
          })
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
